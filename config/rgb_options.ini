[DEFAULT]
# ---- LED matrix hardware (only read at daemon start; change => restart spotipi) ----
rows = 64
columns = 64
chain_length = 1
parallel = 1
# Use 'adafruit-hat-pwm' if you soldered the quality/PWM mod, else 'adafruit-hat'
hardware_mapping = adafruit-hat
# Raise gpio_slowdown (2-4) if the panel flickers on a Pi 4
gpio_slowdown = 2
# Initial brightness 1-100 (live brightness is controlled from the web UI / state.json)
brightness = 60
refresh_rate = 120
default_image = default.png

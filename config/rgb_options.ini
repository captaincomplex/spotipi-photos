[DEFAULT]
# ---- LED matrix hardware ----
# Only read when the daemon starts, so after changing anything here run:
#     sudo systemctl restart spotipi
#
# PANEL SIZE. Two sizes are supported and equally well tested:
#
#   64 x 64  -- 192 x 192 mm. More detail, brighter, draws more current.
#              rows = 64   /   columns = 64
#
#   32 x 32  -- 96 x 96 mm (at the same 3mm pitch). Cheaper, cooler, and
#              perfectly readable for album art; photos are noticeably more
#              abstract at 1024 pixels.
#              rows = 32   /   columns = 32
#
# Whichever you use, set the Mac/PC photo sync to match so it doesn't ship
# pixels that get thrown away:  sync_album.py --size 64   (or --size 32)
rows = 64
columns = 64

chain_length = 1
parallel = 1

# 'adafruit-hat'      -- the standard, no-soldering build.
# 'adafruit-hat-pwm'  -- ONLY after you solder the GPIO4-to-GPIO18 jumper on
#                        the bonnet (the "quality"/PWM mod). Setting this
#                        without the wire gives a broken or blank panel.
hardware_mapping = adafruit-hat

# 1 is the library default. Pi 3 wants 2. A Pi 4 may need 3 or 4 -- raise it
# if the panel shows tearing or garbage.
gpio_slowdown = 2

# Starting brightness 1-100. The live value is controlled from the web UI and
# stored in state.json; this is only what it comes up with on a fresh install.
brightness = 60

refresh_rate = 120
default_image = default.png
